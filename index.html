<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日文練習">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<title>日文練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #E8864A;
  --orange-bg: #FFF3EB;
  --orange-border: #F5C9A8;
  --green: #2ABF7E;
  --green-bg: #E8F9F2;
  --red: #E05252;
  --red-bg: #FEF0F0;
  --text: #1A1A1A;
  --text2: #555;
  --muted: #999;
  --gray: #F4F4F4;
  --gray2: #E0E0E0;
  --card-bg: #fff;
  --bg: #F7F7F7;
  --nav-h: 64px;
  --safe-b: env(safe-area-inset-bottom);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);font-family:'Noto Sans JP',sans-serif;color:var(--text)}
body{min-height:100dvh;background:var(--bg)}

/* ── PAGES ── */
.page{display:none;min-height:100dvh;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px)}
.page.active{display:block}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));background:#fff;border-top:1px solid var(--gray2);display:flex;padding-bottom:var(--safe-b);z-index:200}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;font-size:11px;color:var(--muted);font-family:inherit;cursor:pointer;padding:8px 0}
.nav-btn.active{color:var(--orange)}
.nav-btn .nav-icon{font-size:22px;line-height:1}

/* ── HOME PAGE ── */
.home-header{background:#fff;padding:52px 20px 20px;border-bottom:1px solid var(--gray2)}
.home-title{font-size:26px;font-weight:700;line-height:1.2}
.home-title span{color:var(--orange)}
.home-subtitle{font-size:13px;color:var(--muted);margin-top:4px}
.home-body{padding:16px 16px 0}

.stats-row{display:flex;gap:10px;margin-bottom:16px}
.stat-card{flex:1;background:#fff;border-radius:14px;padding:14px 12px;border:1px solid var(--gray2)}
.stat-num{font-size:26px;font-weight:700;line-height:1}
.stat-num.orange{color:var(--orange)}
.stat-num.green{color:var(--green)}
.stat-label{font-size:11px;color:var(--muted);margin-top:3px}

.section-label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px}

.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-chip{border:1.5px solid var(--gray2);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--text2);background:#fff;cursor:pointer;transition:all .15s;white-space:nowrap}
.filter-chip.sel{background:var(--orange-bg);color:var(--orange);border-color:var(--orange)}

.start-btn{width:100%;background:var(--orange);color:#fff;border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 16px rgba(232,134,74,.4);letter-spacing:.03em}
.start-btn:active{transform:scale(.97)}

.meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.meta-info{font-size:11px;color:var(--muted)}

.type-breakdown{background:#fff;border-radius:14px;border:1px solid var(--gray2);padding:14px 16px;margin-top:16px}
.type-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--gray)}
.type-row:last-child{border-bottom:none}
.type-name{font-size:14px;font-weight:500}
.type-count{font-size:13px;color:var(--muted)}
.type-badge-sm{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;margin-right:6px}
.badge-fill{background:var(--orange-bg);color:var(--orange)}
.badge-choice{background:#EEF0FF;color:#5B6BE8}
.badge-tf{background:var(--green-bg);color:var(--green)}
.badge-conj{background:#F3E8FF;color:#8B4CF5}
.badge-order{background:#E6F4FF;color:#2B7CE8}

/* ── QUIZ PAGE ── */
.quiz-topbar{display:flex;align-items:center;justify-content:space-between;padding:52px 16px 12px;background:#fff;border-bottom:1px solid var(--gray2);position:sticky;top:0;z-index:100}
.quiz-back{background:none;border:none;font-size:16px;color:var(--text2);font-family:inherit;cursor:pointer;padding:6px 10px 6px 2px;font-weight:500}
.quiz-progress{font-size:14px;font-weight:600;color:var(--text2)}
.quiz-star{background:none;border:none;font-size:22px;cursor:pointer;padding:4px 2px 4px 10px;line-height:1}

.progress-wrap{height:3px;background:var(--gray2)}
.progress-fill{height:3px;background:var(--orange);transition:width .4s}

.quiz-body{padding:16px}

.q-badges{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.q-type-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.badge-type-fill{background:var(--orange-bg);color:var(--orange)}
.badge-type-choice{background:#EEF0FF;color:#5B6BE8}
.badge-type-tf{background:var(--green-bg);color:var(--green)}
.badge-type-conj{background:#F3E8FF;color:#8B4CF5}
.badge-type-order{background:#E6F4FF;color:#2B7CE8}
.q-source{font-size:11px;color:var(--muted);padding:3px 9px;background:var(--gray);border-radius:99px}

.q-card{background:#fff;border-radius:18px;padding:20px;border:1px solid var(--gray2);margin-bottom:16px}
.q-category{font-size:11px;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.q-text{font-size:17px;font-weight:500;line-height:1.6;color:var(--text)}
.q-sentence{font-size:18px;font-weight:600;line-height:1.7;margin-top:8px;color:var(--text)}
.blank{display:inline-block;min-width:52px;height:26px;border-bottom:2.5px solid var(--orange);text-align:center;vertical-align:middle;font-size:16px;font-weight:700;color:var(--orange);line-height:26px}
.blank.filled{border-color:transparent;background:var(--orange-bg);border-radius:6px;padding:0 6px}
.blank-hint{font-size:12px;color:var(--muted);margin-top:6px}

/* Answer areas */
.chip-grid{display:flex;gap:10px;flex-wrap:wrap}
.chip-opt{flex:1;min-width:calc(50% - 5px);background:#fff;border:2px solid var(--gray2);border-radius:12px;padding:13px 10px;font-size:17px;font-weight:600;text-align:center;cursor:pointer;font-family:inherit;transition:all .15s;color:var(--text)}
.chip-opt:active:not(.locked){transform:scale(.95)}
.chip-opt.selected{border-color:var(--orange);background:var(--orange-bg);color:var(--orange)}
.chip-opt.correct{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.chip-opt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.chip-opt.locked{cursor:default}

.choice-list{display:flex;flex-direction:column;gap:10px}
.choice-opt{background:#fff;border:2px solid var(--gray2);border-radius:12px;padding:14px 16px;font-size:15px;font-weight:500;text-align:left;cursor:pointer;font-family:inherit;transition:all .15s;color:var(--text);display:flex;align-items:center;gap:10px}
.choice-opt:active:not(.locked){background:var(--gray)}
.choice-letter{font-size:12px;font-weight:700;color:var(--muted);min-width:18px}
.choice-opt.selected{border-color:var(--orange);background:var(--orange-bg)}
.choice-opt.selected .choice-letter{color:var(--orange)}
.choice-opt.correct{border-color:var(--green);background:var(--green-bg)}
.choice-opt.correct .choice-letter{color:var(--green)}
.choice-opt.wrong{border-color:var(--red);background:var(--red-bg)}
.choice-opt.wrong .choice-letter{color:var(--red)}
.choice-opt.reveal{border-color:var(--green);background:var(--green-bg)}
.choice-opt.reveal .choice-letter{color:var(--green)}
.choice-opt.locked{cursor:default}

.tf-row{display:flex;gap:12px}
.tf-btn{flex:1;border:2px solid var(--gray2);border-radius:16px;padding:20px 10px;font-size:32px;text-align:center;cursor:pointer;background:#fff;font-family:inherit;transition:all .15s}
.tf-btn:active:not(.locked){transform:scale(.95)}
.tf-label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-top:4px}
.tf-btn.selected-t{border-color:var(--orange);background:var(--orange-bg)}
.tf-btn.selected-t .tf-label{color:var(--orange)}
.tf-btn.selected-f{border-color:var(--orange);background:var(--orange-bg)}
.tf-btn.selected-f .tf-label{color:var(--orange)}
.tf-btn.correct{border-color:var(--green);background:var(--green-bg)}
.tf-btn.correct .tf-label{color:var(--green)}
.tf-btn.wrong{border-color:var(--red);background:var(--red-bg)}
.tf-btn.wrong .tf-label{color:var(--red)}
.tf-btn.locked{cursor:default}

/* Feedback */
.feedback-card{background:#fff;border-radius:16px;border:2px solid var(--gray2);padding:16px;margin-top:0;display:none}
.feedback-card.show{display:block}
.feedback-card.correct-fb{border-color:var(--green)}
.feedback-card.wrong-fb{border-color:var(--red)}
.feedback-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.feedback-icon{font-size:20px}
.feedback-result{font-size:15px;font-weight:700}
.feedback-result.ok{color:var(--green)}
.feedback-result.ng{color:var(--red)}
.feedback-explain{font-size:13px;line-height:1.65;color:var(--text2);white-space:pre-line}

.next-btn{width:100%;background:var(--text);color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:14px;transition:transform .15s}
.next-btn:active{transform:scale(.97)}
.next-btn.orange-btn{background:var(--orange)}

/* ── COMPLETE PAGE ── */
.complete-wrap{padding:52px 20px 24px;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.complete-emoji{font-size:72px;line-height:1}
.complete-title{font-size:24px;font-weight:700;text-align:center}
.complete-score{font-size:52px;font-weight:700;color:var(--orange);text-align:center;line-height:1}
.complete-denom{font-size:20px;color:var(--muted);font-weight:500}
.complete-pct{font-size:16px;color:var(--text2);font-weight:600}
.complete-breakdown{background:#fff;border-radius:16px;border:1px solid var(--gray2);width:100%;padding:14px 16px;margin-top:4px}
.cb-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--gray);font-size:14px}
.cb-row:last-child{border-bottom:none}
.cb-label{color:var(--text2)}
.cb-score{font-weight:700}
.cb-score.perfect{color:var(--green)}
.complete-btns{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:8px}
.complete-btn{width:100%;border-radius:14px;padding:15px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;border:none;transition:transform .15s}
.complete-btn:active{transform:scale(.97)}
.btn-primary{background:var(--orange);color:#fff}
.btn-secondary{background:var(--gray);color:var(--text)}

/* ── FAVORITES PAGE ── */
.fav-header{padding:52px 20px 16px;background:#fff;border-bottom:1px solid var(--gray2);position:sticky;top:0;z-index:100}
.fav-title{font-size:22px;font-weight:700}
.fav-subtitle{font-size:13px;color:var(--muted);margin-top:2px}
.fav-body{padding:16px}
.fav-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.fav-empty-icon{font-size:48px;margin-bottom:10px}
.fav-empty-text{font-size:14px}
.fav-item{background:#fff;border-radius:14px;border:1px solid var(--gray2);padding:14px 16px;margin-bottom:10px}
.fav-item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fav-q-text{font-size:14px;font-weight:500;line-height:1.5;flex:1}
.fav-unstar{background:none;border:none;font-size:20px;cursor:pointer;padding:0;line-height:1;flex-shrink:0}
.fav-answer{font-size:12px;color:var(--green);font-weight:600;margin-top:6px}
.fav-badges{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.fav-src{font-size:10px;color:var(--muted);background:var(--gray);border-radius:99px;padding:2px 7px}

/* ── SUGGEST MODAL ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:flex-end}
.modal-backdrop.show{display:flex}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px calc(24px + var(--safe-b));width:100%;max-height:80dvh;overflow-y:auto}
.modal-handle{width:40px;height:4px;background:var(--gray2);border-radius:99px;margin:0 auto 20px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:6px}
.modal-desc{font-size:13px;color:var(--muted);margin-bottom:16px}
.modal-textarea{width:100%;border:1.5px solid var(--gray2);border-radius:12px;padding:12px;font-size:14px;font-family:inherit;resize:none;min-height:100px;line-height:1.5;color:var(--text)}
.modal-textarea:focus{outline:none;border-color:var(--orange)}
.modal-btns{display:flex;gap:10px;margin-top:12px}
.modal-cancel{flex:1;background:var(--gray);color:var(--text);border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
.modal-submit{flex:2;background:var(--orange);color:#fff;border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;border-radius:99px;padding:9px 18px;font-size:13px;font-weight:500;z-index:400;opacity:0;transition:all .25s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── CONJUGATION ── */
.conj-display{background:var(--orange-bg);border-radius:16px;padding:18px 20px 14px;text-align:center;margin-top:12px}
.conj-verb{font-size:36px;font-weight:700;color:var(--text);line-height:1.2}
.conj-arrow{font-size:13px;color:var(--muted);margin:6px 0 2px}
.conj-label{font-size:15px;font-weight:700;color:var(--orange);background:#fff;border-radius:99px;display:inline-block;padding:4px 16px;margin-top:2px}

/* ── ORDER ── */
.order-placed{min-height:62px;background:var(--gray);border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;border:2px dashed var(--gray2);align-items:center}
.order-placed.has-words{background:#fff;border-style:solid}
.order-placed-hint{font-size:13px;color:var(--muted)}
.order-word{border-radius:10px;padding:9px 14px;font-size:15px;font-weight:500;cursor:pointer;transition:all .15s;border:2px solid var(--gray2);background:#fff;font-family:inherit;color:var(--text)}
.order-word:active:not(.locked){opacity:.7;transform:scale(.95)}
.order-word.avail{background:#fff;border-color:var(--gray2)}
.order-word.placed{background:var(--orange-bg);border-color:var(--orange);color:var(--orange)}
.order-word.correct-w{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.order-word.wrong-w{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.order-word.locked{cursor:default}
.order-available{display:flex;flex-wrap:wrap;gap:8px;margin-top:0}
.order-section-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;margin-bottom:6px}

/* no quiz page nav */
#page-quiz .bottom-nav-placeholder{height:0}

/* ── EXPORT MODAL ── */
.export-textarea{width:100%;border:1.5px solid var(--gray2);border-radius:12px;padding:12px;font-size:12px;font-family:'Courier New',monospace;resize:none;min-height:220px;line-height:1.5;color:var(--text);background:var(--gray)}
.export-textarea:focus{outline:none;border-color:var(--orange)}
.copy-btn{flex:2;background:var(--green);color:#fff;border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
.copy-btn:active{opacity:.8}
</style>
</head>
<body>

<!-- ── HOME PAGE ── -->
<div class="page active" id="page-home">
  <div class="home-header">
    <div class="home-title">日文<span>練習</span></div>
    <div class="home-subtitle">根據你的 Notion 課堂筆記出題</div>
  </div>
  <div class="home-body">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num orange" id="statToday">0</div>
        <div class="stat-label">今日答題</div>
      </div>
      <div class="stat-card">
        <div class="stat-num green" id="statAccuracy">—</div>
        <div class="stat-label">正確率</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statStreak">0</div>
        <div class="stat-label">🔥 連續天</div>
      </div>
    </div>

    <button class="start-btn" id="startBtn" onclick="startQuiz()">開始練習</button>

    <div class="meta-row">
      <div class="meta-info" id="metaInfo">載入中…</div>
      <button onclick="openSuggest()" style="background:none;border:none;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit">💡 建議功能</button>
    </div>

    <div class="type-breakdown" id="typeBreakdown" style="margin-top:16px">
      <div class="type-row">
        <div class="type-name"><span class="type-badge-sm badge-fill">填空</span>助詞 / 文法挖空</div>
        <div class="type-count" id="countFill">—</div>
      </div>
      <div class="type-row">
        <div class="type-name"><span class="type-badge-sm badge-choice">選擇</span>讀音 / 用法</div>
        <div class="type-count" id="countChoice">—</div>
      </div>
      <div class="type-row">
        <div class="type-name"><span class="type-badge-sm badge-tf">是非</span>正誤判斷</div>
        <div class="type-count" id="countTF">—</div>
      </div>
      <div class="type-row">
        <div class="type-name"><span class="type-badge-sm badge-conj">動詞変化</span>て形 / ない形 / た形</div>
        <div class="type-count" id="countConj">—</div>
      </div>
      <div class="type-row">
        <div class="type-name"><span class="type-badge-sm badge-order">排序</span>語句排列</div>
        <div class="type-count" id="countOrder">—</div>
      </div>
    </div>
  </div>
</div>

<!-- ── QUIZ PAGE ── -->
<div class="page" id="page-quiz">
  <div class="quiz-topbar">
    <button class="quiz-back" onclick="confirmLeave()">← 離開</button>
    <div class="quiz-progress" id="quizProgress">1 / 28</div>
    <button class="quiz-star" id="quizStar" onclick="toggleStar()">☆</button>
  </div>
  <div class="progress-wrap">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>

  <div class="quiz-body" id="quizBody">
    <!-- filled dynamically -->
  </div>
</div>

<!-- ── COMPLETE PAGE ── -->
<div class="page" id="page-complete">
  <div class="complete-wrap">
    <div class="complete-emoji" id="completeEmoji">🎉</div>
    <div class="complete-title">練習完成！</div>
    <div>
      <span class="complete-score" id="completeCorrect">0</span>
      <span class="complete-denom" id="completeDenom">/ 0</span>
    </div>
    <div class="complete-pct" id="completePct"></div>
    <div class="complete-breakdown" id="completeBreakdown"></div>
    <div class="complete-btns">
      <button class="complete-btn btn-primary" onclick="restartQuiz()">再練習一輪</button>
      <button class="complete-btn btn-secondary" onclick="openExport()">📋 匯出記錄</button>
      <button class="complete-btn btn-secondary" onclick="switchPage('home')">返回首頁</button>
    </div>
  </div>
</div>

<!-- ── EXPORT MODAL ── -->
<div class="modal-backdrop" id="exportModal" onclick="closeExport(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">📋 匯出練習記錄</div>
    <div class="modal-desc">複製以下內容，貼到 Notion 或其他筆記工具。</div>
    <textarea class="export-textarea" id="exportText" readonly></textarea>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeExport()">關閉</button>
      <button class="copy-btn" onclick="copyExport()">複製全部</button>
    </div>
  </div>
</div>

<!-- ── FAVORITES PAGE ── -->
<div class="page" id="page-fav">
  <div class="fav-header">
    <div class="fav-title">★ 收藏的題目</div>
    <div class="fav-subtitle" id="favSubtitle">0 題</div>
  </div>
  <div class="fav-body" id="favBody"></div>
</div>

      explanation: "「〜てください」の語順：〔修飾語〕→〔目的語〕→〔動詞てください〕。「4桁の」（修飾）→「暗証番号を」（目的語）→「設定してください」（動詞）。"
    }
  ]
};

</script>
<script>
// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let allQuestions = [];
let deck = [];           // current quiz deck
let currentIdx = 0;
let answered = false;
let score = { correct: 0, total: 0 };
let typeScore = { fill:{c:0,t:0}, choice:{c:0,t:0}, tf:{c:0,t:0}, conjugation:{c:0,t:0}, order:{c:0,t:0} };
let orderPlaced = [];
let orderAvailable = [];
let sessionResults = []; // { q, correct } per question in current session

let starred = new Set(JSON.parse(localStorage.getItem('jq_starred') || '[]'));
let todayStats = JSON.parse(localStorage.getItem('jq_today') || '{"date":"","correct":0,"total":0}');
let streak = parseInt(localStorage.getItem('jq_streak') || '0');
let suggests = JSON.parse(localStorage.getItem('jq_suggests') || '[]');

// Fix today's stats if stale
const today = new Date().toISOString().slice(0,10);
if (todayStats.date !== today) todayStats = { date: today, correct: 0, total: 0 };

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
function init() {
  if (!window.QUIZ_DATA) {
    document.getElementById('metaInfo').textContent = '❌ 無法載入題目，請確認 questions.js 在同一資料夾';
    return;
  }
  allQuestions = window.QUIZ_DATA.questions;
  updateHomeStats();
  updateTypeCounts();
  document.getElementById('metaInfo').textContent =
    `更新：${window.QUIZ_DATA.meta.generated_at} · 共 ${allQuestions.length} 題`;
}

function updateHomeStats() {
  document.getElementById('statToday').textContent = todayStats.total;
  document.getElementById('statAccuracy').textContent =
    todayStats.total > 0 ? Math.round(todayStats.correct / todayStats.total * 100) + '%' : '—';
  document.getElementById('statStreak').textContent = streak;
}

function updateTypeCounts() {
  const qs = allQuestions;
  document.getElementById('countFill').textContent = qs.filter(q => q.type === 'fill').length + ' 題';
  document.getElementById('countChoice').textContent = qs.filter(q => q.type === 'choice').length + ' 題';
  document.getElementById('countTF').textContent = qs.filter(q => q.type === 'tf').length + ' 題';
  document.getElementById('countConj').textContent = qs.filter(q => q.type === 'conjugation').length + ' 題';
  document.getElementById('countOrder').textContent = qs.filter(q => q.type === 'order').length + ' 題';
  document.getElementById('startBtn').textContent = `開始練習（${qs.length} 題）`;
}

// ═══════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const nb = document.getElementById('nav-' + name);
  if (nb) nb.classList.add('active');
  document.getElementById('bottomNav').style.display = 'flex';
  if (name === 'fav') renderFavorites();
  window.scrollTo(0,0);
}

// ═══════════════════════════════════════════
// QUIZ FLOW
// ═══════════════════════════════════════════
function startQuiz() {
  const qs = [...allQuestions];
  if (!qs.length) { showToast('沒有符合條件的題目'); return; }
  deck = shuffle([...qs]);
  currentIdx = 0;
  score = { correct: 0, total: 0 };
  typeScore = { fill:{c:0,t:0}, choice:{c:0,t:0}, tf:{c:0,t:0}, conjugation:{c:0,t:0}, order:{c:0,t:0} };
  sessionResults = [];
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-quiz').classList.add('active');
  document.getElementById('bottomNav').style.display = 'none';
  renderQuestion();
}

function restartQuiz() {
  startQuiz();
}

function renderQuestion() {
  const q = deck[currentIdx];
  answered = false;
  const total = deck.length;

  document.getElementById('quizProgress').textContent = `${currentIdx + 1} / ${total}`;
  document.getElementById('progressFill').style.width = `${(currentIdx / total) * 100}%`;
  document.getElementById('quizStar').textContent = starred.has(q.id) ? '★' : '☆';

  const typeBadge = { fill:'填空', choice:'選擇', tf:'是非', conjugation:'動詞変化', order:'排序' }[q.type] || q.type;
  const typeClass = { fill:'badge-type-fill', choice:'badge-type-choice', tf:'badge-type-tf', conjugation:'badge-type-conj', order:'badge-type-order' }[q.type] || '';

  let answerHTML = '';
  if (q.type === 'fill') {
    const sentenceHTML = q.sentence.replace('___', `<span class="blank" id="blankSpan">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`);
    answerHTML = `<div class="q-sentence">${sentenceHTML}</div>`;
  } else if (q.type === 'conjugation') {
    answerHTML = `
      <div class="conj-display">
        <div class="conj-verb">${q.verb}</div>
      </div>
    `;
  } else {
    answerHTML = '';
  }

  let optionsHTML = '';
  if (q.type === 'fill' || q.type === 'conjugation') {
    optionsHTML = `<div class="chip-grid" id="optionArea">
      ${q.options.map((o,i) => `<button class="chip-opt" data-idx="${i}" onclick="submitAnswer(${i})">${o}</button>`).join('')}
    </div>`;
  } else if (q.type === 'choice') {
    const letters = ['A','B','C','D'];
    optionsHTML = `<div class="choice-list" id="optionArea">
      ${q.options.map((o,i) => `
        <button class="choice-opt" data-idx="${i}" onclick="submitAnswer(${i})">
          <span class="choice-letter">${letters[i]}</span>
          <span>${o}</span>
        </button>`).join('')}
    </div>`;
  } else if (q.type === 'tf') {
    optionsHTML = `<div class="tf-row" id="optionArea">
      <button class="tf-btn" data-idx="true" onclick="submitTF(true)">
        ○<span class="tf-label">正確</span>
      </button>
      <button class="tf-btn" data-idx="false" onclick="submitTF(false)">
        ×<span class="tf-label">錯誤</span>
      </button>
    </div>`;
  } else if (q.type === 'order') {
    orderPlaced = [];
    orderAvailable = shuffle(q.parts.map((_,i) => i));
    optionsHTML = `
      <div class="order-section-label">排列順序</div>
      <div class="order-placed" id="orderPlaced">
        <span class="order-placed-hint">點下方的語句，依序排列</span>
      </div>
      <div class="order-section-label" style="margin-top:14px">語句</div>
      <div class="order-available" id="orderAvailable"></div>
    `;
  }

  document.getElementById('quizBody').innerHTML = `
    <div class="q-badges">
      <span class="q-type-badge ${typeClass}">${typeBadge}</span>
      <span class="q-source">${q.source || ''}</span>
    </div>
    <div class="q-card">
      <div class="q-text">${q.question}</div>
      ${answerHTML}
    </div>
    ${optionsHTML}
    <div class="feedback-card" id="feedbackCard">
      <div class="feedback-top">
        <span class="feedback-icon" id="fbIcon"></span>
        <span class="feedback-result" id="fbResult"></span>
      </div>
      <div class="feedback-explain" id="fbExplain"></div>
      <button class="next-btn orange-btn" onclick="nextQuestion()">
        ${currentIdx + 1 < deck.length ? '下一題 →' : '查看成績 →'}
      </button>
    </div>
  `;

  // For order questions: render the interactive word chips after innerHTML is set
  if (q.type === 'order') renderOrderUI(q);
}

function submitAnswer(selectedIdx) {
  if (answered) return;
  const q = deck[currentIdx];
  const correct = selectedIdx === q.answer;
  answered = true;
  recordResult(q, correct);

  const area = document.getElementById('optionArea');
  const btns = area.querySelectorAll('button');
  btns.forEach(b => {
    b.classList.add('locked');
    const idx = parseInt(b.dataset.idx);
    if (idx === q.answer) b.classList.add('correct');
    else if (idx === selectedIdx && !correct) b.classList.add('wrong');
  });

  // Fill: update blank display
  if (q.type === 'fill') {
    const blank = document.getElementById('blankSpan');
    if (blank) {
      blank.textContent = q.options[selectedIdx];
      blank.classList.add('filled');
      blank.style.color = correct ? 'var(--green)' : 'var(--red)';
      blank.style.background = correct ? 'var(--green-bg)' : 'var(--red-bg)';
    }
  }

  showFeedback(correct, q.explanation);
}

function submitTF(selected) {
  if (answered) return;
  const q = deck[currentIdx];
  const correct = selected === q.answer;
  answered = true;
  recordResult(q, correct);

  const btns = document.querySelectorAll('.tf-btn');
  btns.forEach(b => {
    b.classList.add('locked');
    const val = b.dataset.idx === 'true';
    if (val === q.answer) b.classList.add('correct');
    else if (val === selected && !correct) b.classList.add('wrong');
  });

  showFeedback(correct, q.explanation);
}

// ── ORDER QUESTION INTERACTIONS ───────────────────────
function renderOrderUI(q) {
  const placedEl = document.getElementById('orderPlaced');
  const availEl = document.getElementById('orderAvailable');
  if (!placedEl || !availEl) return;

  if (orderPlaced.length === 0) {
    placedEl.innerHTML = '<span class="order-placed-hint">點下方的語句，依序排列</span>';
    placedEl.classList.remove('has-words');
  } else {
    placedEl.classList.add('has-words');
    placedEl.innerHTML = orderPlaced.map((idx, pos) =>
      `<button class="order-word placed" onclick="removePlaced(${pos})">${q.parts[idx]}</button>`
    ).join('');
  }

  availEl.innerHTML = orderAvailable.map(idx =>
    `<button class="order-word avail" onclick="placeWord(${idx})">${q.parts[idx]}</button>`
  ).join('');
}

function placeWord(idx) {
  if (answered) return;
  const q = deck[currentIdx];
  orderAvailable = orderAvailable.filter(i => i !== idx);
  orderPlaced.push(idx);
  renderOrderUI(q);
  if (orderPlaced.length === q.parts.length) checkOrder(q);
}

function removePlaced(pos) {
  if (answered) return;
  const q = deck[currentIdx];
  const idx = orderPlaced[pos];
  orderPlaced.splice(pos, 1);
  orderAvailable.push(idx);
  renderOrderUI(q);
}

function checkOrder(q) {
  answered = true;
  const correct = JSON.stringify(orderPlaced) === JSON.stringify(q.answer_order);
  recordResult(q, correct);

  // Freeze and colour placed words
  const placedEl = document.getElementById('orderPlaced');
  if (placedEl) {
    placedEl.classList.add('has-words');
    placedEl.innerHTML = orderPlaced.map((idx, pos) => {
      const right = orderPlaced[pos] === q.answer_order[pos];
      return `<button class="order-word ${correct ? 'correct-w' : right ? 'correct-w' : 'wrong-w'} locked">${q.parts[idx]}</button>`;
    }).join('');
  }
  document.querySelectorAll('.order-word.avail').forEach(b => b.classList.add('locked'));

  const extra = correct ? '' : `\n正確順序：${q.correct_sentence}`;
  showFeedback(correct, (q.explanation || '') + extra);
}

function showFeedback(correct, explanation) {
  const card = document.getElementById('feedbackCard');
  const icon = document.getElementById('fbIcon');
  const result = document.getElementById('fbResult');
  const explain = document.getElementById('fbExplain');

  card.classList.add('show');
  card.classList.add(correct ? 'correct-fb' : 'wrong-fb');
  icon.textContent = correct ? '✅' : '❌';
  result.textContent = correct ? '正確！' : '答錯了';
  result.className = 'feedback-result ' + (correct ? 'ok' : 'ng');
  explain.textContent = explanation || '';

  // Scroll to feedback
  setTimeout(() => card.scrollIntoView({ behavior:'smooth', block:'nearest' }), 100);
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx >= deck.length) {
    showComplete();
  } else {
    renderQuestion();
    window.scrollTo(0,0);
  }
}

function recordResult(q, correct) {
  score.total++;
  if (correct) score.correct++;
  typeScore[q.type].total++;
  if (correct) typeScore[q.type].correct++;

  todayStats.total++;
  if (correct) todayStats.correct++;
  localStorage.setItem('jq_today', JSON.stringify(todayStats));
  updateStreakIfNeeded();

  // Track per-session results
  sessionResults.push({ q, correct });

  // Auto-star wrong answers
  if (!correct && !starred.has(q.id)) {
    starred.add(q.id);
    localStorage.setItem('jq_starred', JSON.stringify([...starred]));
    const btn = document.getElementById('quizStar');
    if (btn) btn.textContent = '★';
    showToast('答錯自動收藏 ★');
  }
}

function updateStreakIfNeeded() {
  const lastDay = localStorage.getItem('jq_lastDay');
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  if (lastDay === yesterday || !lastDay) {
    if (lastDay !== today) {
      streak++;
      localStorage.setItem('jq_streak', streak);
      localStorage.setItem('jq_lastDay', today);
    }
  } else if (lastDay !== today) {
    streak = 1;
    localStorage.setItem('jq_streak', streak);
    localStorage.setItem('jq_lastDay', today);
  }
}

// ═══════════════════════════════════════════
// COMPLETE SCREEN
// ═══════════════════════════════════════════
function showComplete() {
  document.getElementById('progressFill').style.width = '100%';
  const pct = Math.round(score.correct / score.total * 100);
  const emoji = pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : pct >= 50 ? '💪' : '📖';

  document.getElementById('completeEmoji').textContent = emoji;
  document.getElementById('completeCorrect').textContent = score.correct;
  document.getElementById('completeDenom').textContent = `/ ${score.total}`;
  document.getElementById('completePct').textContent = `正確率 ${pct}%`;

  const typeNames = { fill:'填空', choice:'選擇', tf:'是非', conjugation:'動詞変化', order:'排序' };
  const bd = document.getElementById('completeBreakdown');
  bd.innerHTML = Object.entries(typeScore)
    .filter(([,v]) => v.total > 0)
    .map(([k,v]) => {
      const p = Math.round(v.correct/v.total*100);
      return `<div class="cb-row">
        <span class="cb-label">${typeNames[k]}</span>
        <span class="cb-score ${p===100?'perfect':''}">${v.correct}/${v.total} (${p}%)</span>
      </div>`;
    }).join('');

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-complete').classList.add('active');
  document.getElementById('bottomNav').style.display = 'flex';
  updateHomeStats();
  window.scrollTo(0,0);
}

function confirmLeave() {
  if (!answered && score.total === 0) {
    switchPage('home');
    return;
  }
  if (confirm('確定要離開練習嗎？（進度不會儲存）')) {
    switchPage('home');
  }
}

// ═══════════════════════════════════════════
// STAR / FAVORITES
// ═══════════════════════════════════════════
function toggleStar() {
  if (!deck.length) return;
  const q = deck[currentIdx];
  if (starred.has(q.id)) {
    starred.delete(q.id);
    document.getElementById('quizStar').textContent = '☆';
    showToast('已取消收藏');
  } else {
    starred.add(q.id);
    document.getElementById('quizStar').textContent = '★';
    showToast('已收藏 ★');
  }
  localStorage.setItem('jq_starred', JSON.stringify([...starred]));
}

function renderFavorites() {
  const starredList = allQuestions.filter(q => starred.has(q.id));
  document.getElementById('favSubtitle').textContent = `${starredList.length} 題`;
  const body = document.getElementById('favBody');
  if (!starredList.length) {
    body.innerHTML = `<div class="fav-empty">
      <div class="fav-empty-icon">☆</div>
      <div class="fav-empty-text">還沒有收藏的題目<br>答錯的題目會自動收藏進來</div>
    </div>`;
    return;
  }
  const typeLabel = { fill:'填空', choice:'選擇', tf:'是非', conjugation:'動詞変化', order:'排序' };
  const typeBadgeCls = { fill:'badge-fill', choice:'badge-choice', tf:'badge-tf', conjugation:'badge-conj', order:'badge-order' };
  body.innerHTML = starredList.map(q => {
    let ans = '';
    if (q.type === 'tf') ans = q.answer ? '○ 正確' : '× 錯誤';
    else if (q.type === 'order') ans = q.correct_sentence;
    else if (q.options) ans = q.options[q.answer];
    const extra = q.type === 'fill' ? `<br><small style="color:var(--muted)">${q.sentence}</small>`
                : q.type === 'conjugation' ? `<br><small style="color:var(--muted)">${q.verb} → ${q.conjugation_type}</small>`
                : '';
    return `<div class="fav-item">
      <div class="fav-item-top">
        <div class="fav-q-text">${q.question}${extra}</div>
        <button class="fav-unstar" onclick="unstar('${q.id}')">★</button>
      </div>
      <div class="fav-answer">答：${ans}</div>
      <div class="fav-badges">
        <span class="fav-src type-badge-sm ${typeBadgeCls[q.type]||''}">${typeLabel[q.type]||q.type}</span>
        <span class="fav-src">${q.source}</span>
      </div>
    </div>`;
  }).join('');
}

function unstar(id) {
  starred.delete(id);
  localStorage.setItem('jq_starred', JSON.stringify([...starred]));
  renderFavorites();
  showToast('已取消收藏');
}

// ═══════════════════════════════════════════
// SUGGEST
// ═══════════════════════════════════════════
function openSuggest() {
  document.getElementById('suggestModal').classList.add('show');
  setTimeout(() => document.getElementById('suggestText').focus(), 200);
}
function closeSuggest(e) {
  if (e && e.target !== document.getElementById('suggestModal')) return;
  document.getElementById('suggestModal').classList.remove('show');
}
function submitSuggest() {
  const text = document.getElementById('suggestText').value.trim();
  if (!text) return;
  suggests.push({ text, date: new Date().toISOString() });
  localStorage.setItem('jq_suggests', JSON.stringify(suggests));
  document.getElementById('suggestText').value = '';
  document.getElementById('suggestModal').classList.remove('show');
  showToast('✅ 建議已儲存');
}

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ═══════════════════════════════════════════
// NOTION EXPORT
// ═══════════════════════════════════════════
function generateNotionExport() {
  const typeNames = { fill:'填空', choice:'選擇', tf:'是非', conjugation:'動詞変化', order:'排序' };
  const pct = score.total > 0 ? Math.round(score.correct / score.total * 100) : 0;
  const dateLabel = new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'});

  let md = `# 日文練習紀錄 ${dateLabel}\n\n`;
  md += `**練習成果：** ${score.correct}/${score.total} 題（正確率 ${pct}%）\n\n`;

  // Type breakdown
  md += `## 題型分析\n`;
  Object.entries(typeScore).filter(([,v]) => v.total > 0).forEach(([k, v]) => {
    const p = Math.round(v.correct / v.total * 100);
    const flag = p < 100 ? ' ⚠️' : ' ✅';
    md += `- **${typeNames[k]}**：${v.correct}/${v.total}${flag}\n`;
  });
  md += '\n---\n\n';

  // Wrong answers
  const wrong = sessionResults.filter(r => !r.correct);
  if (wrong.length === 0) {
    md += `## 🏆 全部答對！太厲害了！\n`;
  } else {
    md += `## ❌ 需要複習的題目（${wrong.length} 題）\n\n`;
    wrong.forEach((r, i) => {
      const q = r.q;
      md += `### ${i + 1}. ${q.question}\n`;
      if (q.type === 'tf') {
        md += `> **正確答案：** ${q.answer ? '○ 正確' : '× 錯誤'}\n`;
      } else if (q.type === 'order') {
        md += `> **正確順序：** ${q.correct_sentence}\n`;
      } else if (q.options) {
        md += `> **正確答案：** ${q.options[q.answer]}\n`;
      }
      if (q.explanation) md += `\n${q.explanation}\n`;
      md += `\n*來源：${q.source}*\n\n`;
    });
  }

  // Correct answers summary
  const correct = sessionResults.filter(r => r.correct);
  if (correct.length > 0) {
    md += `---\n\n## ✅ 答對的題目（${correct.length} 題）\n`;
    correct.forEach((r, i) => {
      md += `${i + 1}. ${r.q.question} *(${r.q.source})*\n`;
    });
  }

  return md;
}

function openExport() {
  const md = generateNotionExport();
  document.getElementById('exportText').value = md;
  document.getElementById('exportModal').classList.add('show');
}

function closeExport(e) {
  if (e && e.target !== document.getElementById('exportModal')) return;
  document.getElementById('exportModal').classList.remove('show');
}

function copyExport() {
  const ta = document.getElementById('exportText');
  ta.select();
  ta.setSelectionRange(0, 99999);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(ta.value).then(() => {
      showToast('✅ 已複製到剪貼簿');
      closeExport();
    }).catch(() => {
      document.execCommand('copy');
      showToast('✅ 已複製到剪貼簿');
      closeExport();
    });
  } else {
    document.execCommand('copy');
    showToast('✅ 已複製到剪貼簿');
    closeExport();
  }
}

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════
init();

// PWA service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
